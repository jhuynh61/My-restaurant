<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="forms.css">
    <title>Create Reservation</title>
</head>
<body>
    <header class="site-init">
        <h1>My Restaurant</h1>
        <nav class="navigation">
            <a href="index.html">Home</a>
            <a href="reservation.html">Reservations</a>
            <a href="createReservation.html">Create a Reservation</a>
        </nav>
    </header>
    <main>
        <div class="reservation-wrapper">
            <div reservation-header>
                <h1>Reserve your table</h1>
                <p>Come enjoy our scenic setting in our rustic Itallian restaurant! The food and atmosphere are to die for!</p>
            </div>
<form class="reservation-form" action="#" method="post">
    <div class="input-group">
        <label for="reservation-date">Date:</label>
        <input type="date" id="reservation-date" name="date" required>
    </div>

    <div class="input-group">
        <label for="reservation-time">Time:</label>
        <input type="time" id="reservation-time" name="time" required>
    </div>

    <div class="input-group">
        <label for="guest-name">Guest name:</label>
        <input type="text" id="guest-name" name="guestName" required>
    </div>

    <div class="input-group">
        <label for="party-size">Party size:</label>
        <input type="number" id="party-size" name="partySize" min="1" required>
    </div>

    <fieldset>
        <legend>Payment Details</legend>

        <div class="input-group">
            <label for="card-name">Name on card:</label>
            <input type="text" id="card-name" name="cardName"
                   autocomplete="cc-name" required>
        </div>

        <div class="input-group">
            <label for="card-number">Card number:</label>
            <input type="text" id="card-number" name="cardNumber"
                   inputmode="numeric" autocomplete="cc-number" required>
        </div>

        <div class="input-group">
            <label for="expiration">Expiration date:</label>
            <input type="month" id="expiration" name="expiration"
                   autocomplete="cc-exp" required>
        </div>

        <div class="input-group">
            <label for="cvv">CVV:</label>
            <input type="password" id="cvv" name="cvv"
                   inputmode="numeric" autocomplete="cc-csc"
                   pattern="[0-9]{3,4}" maxlength="4" required>
        </div>
    </fieldset>

    <fieldset>
        <legend>Billing Address</legend>

        <div class="input-group">
            <label for="billing-address">Street address:</label>
            <input type="text" id="billing-address" name="billingAddress"
                   autocomplete="billing street-address" required>
        </div>

        <div class="input-group">
            <label for="billing-city">City:</label>
            <input type="text" id="billing-city" name="city"
                   autocomplete="billing address-level2" required>
        </div>

        <div class="input-group">
            <label for="billing-zip">ZIP code:</label>
            <input type="text" id="billing-zip" name="zipCode"
                   autocomplete="billing postal-code" required>
        </div>
    </fieldset>

    <button type="submit">Submit Reservation</button>
</form>
        </div>
    </main>
</body>
</html>
